[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."warm-camera"]
  schedule = "*/4 * * * *"

[[redirects]]
  from = "/api/camera"
  to = "/.netlify/functions/camera"
  status = 200

[functions."push-send-today"]
schedule = "0 22 * * *"

[functions."push-send-tomorrow"]
schedule = "0 11 * * *"

