<!-- user.html — USER CONTROLS -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="theme-color" content="#8f61a5"/>
  <title>EVENT ATTENDANCE</title>

  <!-- Shared styles -->
  <link rel="stylesheet" href="./event.css">
  <link rel="stylesheet" href="/shared/stylesheet/left-kebab.css">

  <!-- JS (order matters) -->
  <script src="/auth.js"></script>
  <script src="/shared/camera/greetings-kebab.js" defer></script>
  <script src="https://unpkg.com/@zxing/library@0.21.2/umd/index.min.js" defer></script>
  <script src="./event.js" defer></script>
  <script src="./camera-event.js" defer></script>

</head>
<body class="page">

  <!-- ===== Header ===== -->
  <header class="topgrid" role="banner">
    <div class="col col--l">
      <button id="kebabBtn" class="kebab-btn" type="button" aria-label="Open menu">⋮</button>
    </div>

    <div class="col col--c">
      <h1 class="title"><span id="yy"></span>EVENT ATTENDANCE</h1>
    </div>

    <div class="col col--r">
      <button id="btnClose" class="closeBtn" aria-label="Return to dashboard" type="button">×</button>
    </div>
  </header>

  
  <div id="statusRow" class="statusRow">
    <div id="statusText" class="statusText">Please wait</div>
    <div class="dotsBox"><span id="statusDots">...</span></div>
  </div>

  <!-- ===== EVENT INFO ===== -->
  <div class="title" style="color:#FFF; text-align:left;">STEP 1 - Check the event</div>
  
  <section class="card card--form" aria-label="Event info">
  
   <div class="field">
      <div class="label">Event name</div>
      <input id="eventName" class="input upper" type="text" disabled>
	  <div class="hint" id="tabName">Tab name</div>
   </div>

<div class="rowCol">
 <div class="col">
   <div class="field">
      <div class="label">Event date</div>
      <input id="eventDate" class="input upper" type="text" disabled>
   </div>
  </div>

  <div class="col">	
	<div class="field">
      <div class="label">No. of attendees</div>
      <input id="attendeeCount" class="input upper" type="text" disabled>
   </div>
  </div>
	  
  </section>


  <!-- ===== EVENT ATTENDANCE ===== -->
  <div class="title" style="color:#FFF; text-align:left;">STEP 2 - If event is correct, take the attendance</div>
  
  <section class="card card--form" aria-label="Event attendance"> 

  <div class="field">
  	<div class="label">Session</div>

  		<select class="input" id="attendanceType" required>
    	<option value="">Please select</option>
    	<option value="clockIn">CLOCK IN</option>
    	<option value="clockOut">CLOCK OUT</option>
  		</select>

  </div>

	  
   <div class="rowCol">
      <div class="col">
        <button id="btnCamera" class="btn peach" type="button" disabled>Camera</button>
	  </div>
      <div class="col">
         <button id="btnScanner" class="btn peach" type="button" disabled>Scanner</button>
	  </div>
	  <div class="col">
         <button id="btnManual" class="btn peach" type="button" disabled>Manual</button>
	  </div>
   </div>

   <div class="btnRow">
      <button id="btnAttendance" class="btn" type="button" disabled>Attendance Report</button>
   </div>
	  
  </section>

  <!-- ===== CAMERA AND ATTENDANCE CARD ===== -->
  	
    <div id="status" class="status hidden" aria-live="polite">Recording …</div>

    <!-- Result (NO recorded by row) -->
    <section id="result" class="card hidden" aria-live="polite" aria-atomic="true">
      <div class="row"><div class="label">Name</div><div class="value bold" id="resName">—</div></div>
      <div class="row"><div class="label">ID</div><div class="value" id="resId">—</div></div>
      <div class="row"><div class="label">Mark</div><div class="value" id="resMark">—</div></div>
      <div class="row"><div class="label">Clock-in time</div><div class="value" id="resTime">—</div></div>

      <div class="cardActions cardActionsCamera">
        <button id="closeCard" class="btn closeCard" type="button">Close</button>
        <button id="nextBtn" class="btn nextBtn" type="button">Next</button>
      </div>
    </section>

    <dialog id="camDlg" class="camDlg">
      <div class="camHead">
        <div class="camTitle">Scan student QR</div>
        <button id="closeCam" class="xBtn" aria-label="close" type="button">×</button>
      </div>
      <div class="camBody">
        <video id="preview" playsinline muted></video>
      </div>
    </dialog>
	  	  
  
  <!-- ===== EVENT EDIT ===== -->
  <div class="title" style="color:#FFF; text-align:left;">STEP 3 - If event is incorrect, edit then save</div>
  
  <section class="card card--form" aria-label="Event edit"> 
  
   <div class="rowCol">
      <div class="col">
        <button id="btnEdit" class="btn peach" type="button" disabled>Edit</button>
	  </div>
      <div class="col">
         <button id="btnSave" class="btn peach" type="button" disabled>Save</button>
	  </div>
   </div>  

  </section>

<!-- ===== KEBAB OVERLAY ===== -->
   <div class="overlay" id="overlay" hidden>
      <div class="overlay-panel">
        <div class="panel-head">
          <div class="panel-title">Greetings</div>
          <button class="panel-close" id="panelCloseBtn" type="button">✕</button>
        </div>

        <div class="panel-list">
          <button class="panel-item" id="goBook" type="button">Book greetings</button>
          <button class="panel-item" id="goMine" type="button">Personal schedule</button>
          <button class="panel-item" id="goAdmin" type="button" hidden>Admin</button>
          <button class="panel-item" id="goSS" type="button" hidden>Duty schedule</button>
		  <button class="panel-item" id="goDuty" type="button" hidden>Duty attendance</button>
        </div>
      </div>

      <div class="overlay-dim" id="overlayDim"></div>
    </div>
	
  <!-- ===== END OF KEBAB OVERLAY ===== -->
</body>
</html>
